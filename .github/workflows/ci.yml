name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "False"
      SECRET_KEY: ci-only-not-a-secret
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://postgres:dev@localhost:5432/money
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Start Postgres with Podman
        run: ./scripts/dev-db.sh

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if podman exec ma-postgres pg_isready -h 127.0.0.1 -U postgres -d money; then
              exit 0
            fi
            sleep 2
          done
          podman logs ma-postgres
          exit 1

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Migrate
        run: python manage.py migrate --noinput

      - name: Pytest
        run: pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image with Podman
        run: podman build -f Containerfile -t money-assistant:ci .
